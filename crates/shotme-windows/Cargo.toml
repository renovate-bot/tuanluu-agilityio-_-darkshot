[package]
name = "shotme-windows"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "shotme"
path = "src/main.rs"

[dependencies]
shotme-core = { path = "../shotme-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Security"] }

[build-dependencies]
embed-resource = "3.0.12"
