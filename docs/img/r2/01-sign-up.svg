<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Sign up form">
<rect width="720" height="400" fill="#14161a"/>
<rect x="12" y="12" width="696" height="352" rx="8" fill="#1d2025" stroke="#3a3f47"/>
<rect x="12" y="12" width="696" height="30" rx="8" fill="#262a31"/>
<circle cx="30" cy="27" r="5" fill="#5a606a"/><circle cx="48" cy="27" r="5" fill="#5a606a"/><circle cx="66" cy="27" r="5" fill="#5a606a"/>
<rect x="90" y="19" width="400" height="16" rx="8" fill="#14161a"/>
<text x="102" y="31" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9aa3af">dash.cloudflare.com/sign-up</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e6e8eb">
<text x="230" y="90" font-size="20" font-weight="bold">Create your account</text>
<text x="230" y="120" font-size="12" fill="#9aa3af">Email</text><rect x="230" y="126" width="260" height="30" rx="4" fill="#14161a" stroke="#4a505a"/><text x="240" y="146" font-size="13">you@example.com</text>
<text x="230" y="180" font-size="12" fill="#9aa3af">Password</text><rect x="230" y="186" width="260" height="30" rx="4" fill="#14161a" stroke="#4a505a"/><text x="240" y="206" font-size="13">************</text>
<rect x="230" y="250" width="260" height="32" rx="5" fill="#2b2f36" stroke="#4C8DFF" stroke-width="2"/><text x="360" y="271" text-anchor="middle">Sign up</text>
<circle cx="215" cy="142" r="12" fill="#4C8DFF"/><text x="215" y="147" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1020">1</text>
<circle cx="215" cy="202" r="12" fill="#4C8DFF"/><text x="215" y="207" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1020">2</text>
<circle cx="215" cy="266" r="12" fill="#4C8DFF"/><text x="215" y="271" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1020">3</text>
<text x="230" y="320" font-size="12" fill="#9aa3af">Then confirm the link sent to your email.</text>
</g>
<text x="360" y="386" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9aa3af">Simplified illustration, not a Cloudflare screenshot</text>
</svg>
